{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="card p-4 p-md-5 mt-4">
        <h2 class="mb-4">Профиль</h2>
        <div class="row">
          <div class="col-md-4 mb-4 mb-md-0">
            <div class="card p-3 h-100">
              {% if request.user.avatar %}
                <img src="{{ request.user.avatar.url }}" alt="avatar" class="img-fluid rounded"/>
              {% endif %}
              <p class="mt-3 mb-1"><strong>{{ request.user.get_full_name|default:request.user.email }}</strong></p>
              <p class="text-muted mb-0">{{ request.user.email }}</p>
            </div>
          </div>
          <div class="col-md-8">
            <div class="card p-3 h-100">
              <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex flex-wrap gap-2">
                  <button type="submit" class="btn btn-primary">Сохранить</button>
                  <a href="{% url 'users:logout' %}" class="btn btn-outline-secondary">Выйти</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
