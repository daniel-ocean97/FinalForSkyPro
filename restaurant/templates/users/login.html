{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card p-4 p-md-5 mt-4">
        <h2 class="mb-4">Вход</h2>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary">Войти</button>
        </form>
        <p class="mt-3">Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрируйтесь</a></p>
        <p class="mt-1"><a href="{% url 'restaurant:about' %}">На главную</a></p>
        {% if form.errors %}
          <div class="alert alert-danger mt-3">
            Проверьте правильность введённых данных.
          </div>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
